<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>Ages of War – přehled spritů jednotek</title>
<style>
body { margin: 0; background: #2d4a26; color: #eadfc4; font: 12px Georgia, serif; }
h1 { font-size: 15px; margin: 8px 12px; color: #e2bc4a; }
.row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 4px 12px; border-bottom: 1px solid rgba(0,0,0,0.25); }
.row .name { width: 120px; color: #f1d36a; font-size: 11px; }
canvas { image-rendering: auto; }
</style></head><body>
<h1>Sprity jednotek – 8 směrů × animace (živě z herního rendereru) · ?zoom=3 · ?anim=walk</h1>
<div id="root"></div>
<script type="module">
import { unitSprite, animFrameCount } from '../render/sprites.js';
import { ERAS, makeTechTable } from '../../shared/data.js';
const q = new URLSearchParams(location.search); const Z = +(q.get('zoom') || 3); const anims = (q.get('anim') || 'idle,walk,attack,work').split(',');
const sprites = []; for (const [eraId, era] of Object.entries(ERAS)) for (const f of era.factions) { const tech = makeTechTable(eraId, f.id); for (const u of Object.values(tech.units)) if (!sprites.some(s => s.sprite === u.sprite)) sprites.push({ sprite: u.sprite, faction: f.id, era: eraId, name: u.name }); }
const only = q.get('only'); const list = only ? sprites.filter(s => s.sprite.includes(only)) : sprites;
const root = document.getElementById('root'); const t0 = performance.now(); let frameNo = 0;
const rows = list.map(s => { const row = document.createElement('div'); row.className = 'row'; const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = `${s.sprite} (${s.faction})`; row.appendChild(nm); const cvs = []; for (const a of anims) for (let d = 0; d < 8; d++) { const c = document.createElement('canvas'); c.width = 34 * Z; c.height = 54 * Z; row.appendChild(c); cvs.push({ c, a, d }); } root.appendChild(row); return { s, cvs }; });
function draw() { frameNo++; for (const { s, cvs } of rows) for (const { c, a, d } of cvs) { const n = animFrameCount(a); const fr = Math.floor(frameNo / 6) % n; const spr = unitSprite(s.sprite, 0, d, a, fr, { faction: s.faction, workKind: 'tree' }); const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); ctx.drawImage(spr.canvas, (17 - spr.ax) * Z, (48 - spr.ay) * Z, spr.w * Z, spr.h * Z); } if (!q.get('still')) requestAnimationFrame(draw); }
draw(); window.__t = () => (performance.now() - t0).toFixed(0);
window.__sheet = (cw = 34 * Z, ch = 54 * Z) => { const rs = [...document.querySelectorAll('.row')]; const per = anims.length * 8; const W = 130 + per * cw, H = rs.length * (ch + 4); const out = document.createElement('canvas'); out.width = W; out.height = H; const c = out.getContext('2d'); c.fillStyle = '#2d4a26'; c.fillRect(0, 0, W, H); c.fillStyle = '#f1d36a'; c.font = '11px Georgia'; rs.forEach((r, i) => { const y = i * (ch + 4); c.fillText(r.querySelector('.name').textContent, 4, y + ch / 2); [...r.querySelectorAll('canvas')].forEach((cv, j) => c.drawImage(cv, 130 + j * cw, y, cw, ch)); }); return out.toDataURL('image/png'); };
</script>
</body></html>
